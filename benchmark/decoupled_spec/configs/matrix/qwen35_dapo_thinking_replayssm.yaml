schema_version: 1
campaign:
  name: qwen35-27b-tp4-draft-0.8b-tp1-k3-f1-dapo-thinking-cpp-replayssm
  description: >-
    Paired overlap/non-overlap scaling matrix for the v0.5.17 decoupled-spec
    implementation. Every case is one independent, sealed RUN_DIR.
configs:
  verifier_by_mode:
    nonoverlap: benchmark/decoupled_spec/configs/verifier/qwen35_27b_tp4_k3_f1_non_overlap_cpp_replayssm_bs64.yaml
    overlap: benchmark/decoupled_spec/configs/verifier/qwen35_27b_tp4_k3_f1_overlap_cpp_replayssm_bs64.yaml
  drafter: benchmark/decoupled_spec/configs/drafter/qwen35_0_8b_tp1_k3_f1_cpp_bs64.yaml
  client: benchmark/decoupled_spec/configs/client/dapo_math_17k_row0_thinking_bs1_out1024.yaml
  observability: benchmark/decoupled_spec/configs/observability/qwen35_tp4_tp1.yaml
  workload_inspection: benchmark/decoupled_spec/configs/matrix/qwen35_dapo_thinking_bs64_out32768.inspect.json
axes:
  modes: [nonoverlap, overlap]
  batch_sizes: [8, 16, 32, 64]
  output_lengths: [1024, 4096, 16384, 32768]
expected:
  target_model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-27B
  target_tp_size: 4
  target_cuda_visible_devices: ["0", "1", "2", "3"]
  drafter_model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-0.8B
  drafter_tp_size: 1
  drafter_cuda_visible_devices: ["4"]
  random_seed: 42
  dataset_format: dapo_math_17k
  dataset_path: /path/to/ssd_dtgl/datasets/DAPO-Math-17k/data/dapo-math-17k.parquet
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  verifier_replayssm_flag: enable_linear_replayssm_spec
  verifier_mamba_slots_per_request: 5
  drafter_mamba_slots_per_request: 8
  max_total_tokens: 2200000
  cuda_graph_bs_decode: [8, 16, 32, 64]
  capacity_reference:
    selected_rows: first_64_unshuffled
    prompt_len_min: 94
    prompt_len_max: 217
    prompt_len_sum: 9232
    verify_reserve_per_request: 4
    bs64_out32768_required_tokens: 2106640
    inspection_sha256: 155dc5489c7e873620f8f69a27bcea40c1d14d001c78207a413fdf8aaf62a6f4
  data_plane_backend: cpp_gpu_tail
  chat_template_mode: tokenizer
  enable_thinking: true
  temperature: 0
  ignore_eos: true
execution:
  ordering: [mode, batch_size, output_len]
  results_root: benchmark/decoupled_spec/results
  prerequisites:
    - id: draft_inbox_segment_bs8_correctness
      initial_state: pending
      description: >-
        Before any matrix GPU case, migrate and validate the v0.5.14-dev
        drafter inbox/segment behavior with a real BS8 decoupled-spec probe.
        This gate prevents a known head-of-line ownership gap from being
        misreported as a scaling result.
  incomplete_policy: >-
    Never delete, overwrite, seal, or reuse a failed attempt. Record it as
    incomplete and create a new unique RUN_DIR for a retry.
  capacity_dominance: >-
    A confirmed capacity failure blocks only cases in the same mode whose
    batch_size and output_len are both greater than or equal to the failed
    case. Non-capacity failures do not prune the matrix.
stop_gates:
  hard:
    require_all_campaign_prerequisites: true
    require_sealed_audit: true
    require_exact_config_match: true
    min_verifier_boot_max_total_num_tokens: 2106640
    min_drafter_boot_max_total_num_tokens: 2106640
    min_verifier_boot_mamba_cache_size: 320
    min_drafter_boot_mamba_cache_size: 512
    require_cpp_dataplane_selection_log: true
    require_completed_count_equals_batch_size: true
    require_completion_tokens_equals_batch_times_output_len: true
    min_spec_verify_ct: 1
    min_spec_num_proposed_drafts: 0
  diagnostic:
    require_nonzero_spec_proposals: true
    min_spec_accept_rate: 0.50
    min_spec_draft_occupancy_rate: 0.25
    max_overlap_accept_rate_drop_vs_nonoverlap: 0.10
