schema_version: 2
deployment: coupled_spec

ray:
  address: auto
  namespace: qwen35-27b-tp4-mtp-k3-overlap
  placement_timeout_s: 600
  startup_timeout_s: 1800
  shutdown_grace_s: 30

target:
  replicas: 1
  runtime:
    env:
      SGLANG_RECORD_STEP_TIME: "1"
  server_args:
    model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-27B
    tp_size: 4
    random_seed: 42
    mem_fraction_static: 0.762
    enable_metrics: true
    decode_log_interval: 40
    skip_server_warmup: true
    max_running_requests: 64
    chunked_prefill_size: 16384
    max_prefill_tokens: 16384
    max_total_tokens: 300000
    disable_prefill_cuda_graph: true
    mm_feature_transport: cpu
    speculative_algorithm: EAGLE
    speculative_draft_model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-27B
    speculative_num_steps: 3
    speculative_eagle_topk: 1
    speculative_num_draft_tokens: 4
    disable_overlap_schedule: false
    max_mamba_cache_size: 320
    mamba_radix_cache_strategy: extra_buffer
    enable_linear_replayssm_spec: true
    cuda_graph_bs_decode: [1, 8, 16, 32, 64]
