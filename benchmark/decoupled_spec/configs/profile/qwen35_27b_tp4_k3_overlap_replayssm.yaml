schema_version: 1

profile:
  steps: [0, 1, 2, 3]
  batch_sizes: [8, 16, 32, 64]
  context_lens: [1024, 4096, 8192, 16384, 32768]
  warmup_iters: 10
  measure_iters: 50
  random_seed: 42

runtime:
  env:
    SGLANG_DECOUPLED_SPEC_USE_CPP_PYBIND: "1"
    SGLANG_RAGGED_VERIFY_MODE: static

server_args:
  model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-27B
  tp_size: 4
  random_seed: 42
  mem_fraction_static: 0.762
  max_running_requests: 64
  chunked_prefill_size: 16384
  max_prefill_tokens: 16384
  max_total_tokens: 2200000
  max_mamba_cache_size: 320
  mamba_radix_cache_strategy: extra_buffer
  enable_linear_replayssm: false
  enable_linear_replayssm_spec: true
  disable_overlap_schedule: false
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  page_size: 1
  attention_backend: fa3
  mm_feature_transport: cpu
