schema_version: 1
role: verifier
runtime:
  cuda_visible_devices: ["0", "1", "2", "3"]
  env:
    SGLANG_DECOUPLED_SPEC_USE_CPP_PYBIND: "1"
    SGLANG_RAGGED_VERIFY_MODE: static
server_args:
  model_path: /path/to/ssd_dtgl/models/Qwen/Qwen3.5-27B
  tp_size: 4
  host: 127.0.0.1
  port: 30000
  nccl_port: 32100
  random_seed: 42
  enable_deterministic_inference: true
  enable_metrics: true
  uvicorn_access_log_exclude_prefixes: [/metrics, /v1/loads, /health]
  skip_server_warmup: true
  max_running_requests: 64
  max_total_tokens: 2200000
  max_mamba_cache_size: 320
  cuda_graph_bs_decode: [8, 16, 32, 64]
  mamba_radix_cache_strategy: extra_buffer
  mamba_ssm_dtype: float32
  enable_linear_replayssm: false
  enable_linear_replayssm_spec: false
  disable_prefill_cuda_graph: true
  mm_feature_transport: cpu
  disable_overlap_schedule: false
  speculative_algorithm: DECOUPLED_VERIFY
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  decoupled_spec_role: verifier
  decoupled_spec_rank: 0
  decoupled_spec_bind_endpoint: tcp://127.0.0.1:31100
  decoupled_spec_connect_endpoints: [tcp://127.0.0.1:31101]
